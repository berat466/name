<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Açık Dünya</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb7cc; font-family: system-ui, sans-serif;
               overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); padding: 8px 10px;
         background: rgba(15,20,28,.62); color: #e8eef5; font-size: 12px; line-height: 1.45; border-radius: 8px;
         max-width: calc(100vw - 90px); pointer-events: none; }
  #hud b { color: #fff; }
  #hud small { opacity: .65; font-size: 10px; display: block; max-width: 300px; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px;
          background: #1b2430; transition: opacity .4s; z-index: 10; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .btn { pointer-events: auto; position: absolute; width: 58px; height: 58px; border-radius: 50%;
         background: rgba(15,20,28,.6); color: #fff; font-size: 22px; display: grid; place-items: center;
         border: 1px solid rgba(255,255,255,.28); touch-action: none; text-align: center; white-space: pre-line;
         -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .btn:active { background: rgba(80,140,220,.65); }
  #bMode { right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); width: 46px; height: 46px; font-size: 20px; }
  #bUp   { right: max(18px, env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom)); }
  #bDown { right: max(18px, env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); }
  #bSpeed { right: calc(86px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); font-size: 12px; line-height: 1.2; }
  #joy { position: absolute; display: none; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
         border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
          background: rgba(255,255,255,.55); }
  #hint { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom));
          color: #fff; font-size: 12px; line-height: 1.5; background: rgba(15,20,28,.55); padding: 8px 10px; border-radius: 8px;
          max-width: 46vw; transition: opacity 1.2s; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="load">Harita yükleniyor…</div>
<div id="hud">
  <b id="name">Harita</b> · <span id="info"></span><br>
  <span id="pos"></span>
  <div id="help"><small>Sol tık: kaydır · Sağ tık: döndür · Tekerlek: yakınlaş · WASD hareket<br>✈ düğmesi: uçuş modu (WASD + fare, Q/E alçal-yüksel, Shift hızlı)</small></div>
  <small id="attr"></small>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
